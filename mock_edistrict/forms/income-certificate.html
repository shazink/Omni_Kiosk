<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application for Income Certificate - e-District Kerala</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #1a365d;
            border-bottom: 2px solid #3182ce;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #2d3748;
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            border-color: #3182ce;
            outline: none;
        }
        .btn-submit {
            background-color: #2b6cb0;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-submit:hover {
            background-color: #2c5282;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Government of Kerala - e-District Portal</h2>
        <h3>Application for Income Certificate</h3>
        <form id="incomeCertificateForm" action="/api/submit-application" method="POST" enctype="multipart/form-data">
            
            <div class="form-group">
                <label for="txtApplicantName">Full Name *</label>
                <input type="text" id="txtApplicantName" name="applicant_name" required placeholder="Enter full name as per Aadhaar">
            </div>

            <div class="form-group">
                <label for="txtAadhaarNo">Aadhaar UID * (12 Digits)</label>
                <input type="text" id="txtAadhaarNo" name="aadhaar_no" pattern="[0-9]{12}" required placeholder="12-digit Aadhaar UID">
            </div>

            <div class="form-group">
                <label for="ddlDistrict">District *</label>
                <select id="ddlDistrict" name="district" required>
                    <option value="">-- Select District --</option>
                    <option value="Thiruvananthapuram">Thiruvananthapuram</option>
                    <option value="Ernakulam">Ernakulam</option>
                    <option value="Kozhikode">Kozhikode</option>
                    <option value="Thrissur">Thrissur</option>
                    <option value="Kannur">Kannur</option>
                </select>
            </div>

            <div class="form-group">
                <label for="ddlTaluk">Taluk *</label>
                <select id="ddlTaluk" name="taluk" required>
                    <option value="">-- Select Taluk --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="ddlVillage">Village *</label>
                <select id="ddlVillage" name="village" required>
                    <option value="">-- Select Village --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="txtRationCardNo">Ration Card Number *</label>
                <input type="text" id="txtRationCardNo" name="ration_card_no" required placeholder="Ration Card Number">
            </div>

            <div class="form-group">
                <label for="txtAnnualIncome">Annual Family Income (INR) *</label>
                <input type="number" id="txtAnnualIncome" name="annual_income" min="1" required placeholder="Annual Income in Rupees">
            </div>

            <div class="form-group">
                <label for="ddlPurpose">Purpose *</label>
                <select id="ddlPurpose" name="purpose" required>
                    <option value="">-- Select Purpose --</option>
                    <option value="Higher Education">Higher Education</option>
                    <option value="Scholarship">Scholarship</option>
                    <option value="Housing Scheme">Housing Scheme</option>
                    <option value="General">General</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fileAadhaar">Upload Aadhaar Document (PDF/PNG/JPG) *</label>
                <input type="file" id="fileAadhaar" name="aadhaar_doc" accept=".pdf,.png,.jpg" required>
            </div>

            <div class="form-group" style="margin-top: 24px;">
                <button type="submit" id="btnSubmit" class="btn-submit">Submit Application</button>
            </div>
        </form>
    </div>

    <script>
        const talukData = {
            "Thiruvananthapuram": ["Neyyattinkara", "Nedumangad", "Kattakada", "Chirayinkeezhu", "Varkala", "Thiruvananthapuram"],
            "Ernakulam": ["Aluva", "Kanayannur", "Kochi", "Kothamangalam", "Kunnathunad", "Muvattupuzha", "North Paravur"],
            "Kozhikode": ["Kozhikode", "Koyilandy", "Thamarassery", "Vadakara"],
            "Thrissur": ["Thrissur", "Chalakudy", "Kodungallur", "Mukundapuram", "Talappilly"],
            "Kannur": ["Kannur", "Taliparamba", "Payyanur", "Iritty", "Thalassery"]
        };

        const villageData = {
            "Neyyattinkara": ["Nemom", "Neyyattinkara", "Athiyannoor", "Balaramapuram", "Chenkal", "Kanjiramkulam", "Karumkulam", "Kulathoor", "Parassala", "Poovar", "Vizhinjam"],
            "Nedumangad": ["Nedumangad", "Aruvikkara", "Karakulam", "Vembayam", "Anad"],
            "Kattakada": ["Kattakada", "Maranalloor", "Malayinkeezhu", "Vilappil", "Vilavoorkkal"],
            "Kanayannur": ["Edappally", "Ernakulam", "Kadavanthra", "Poonithura", "Vyttila"],
            "Kozhikode": ["Kasaba", "Kakkodi", "Olavanna", "Pantheeramkavu", "Chevayur"]
        };

        const districtSelect = document.getElementById('ddlDistrict');
        const talukSelect = document.getElementById('ddlTaluk');
        const villageSelect = document.getElementById('ddlVillage');

        districtSelect.addEventListener('change', function() {
            const district = this.value;
            talukSelect.innerHTML = '<option value="">-- Select Taluk --</option>';
            villageSelect.innerHTML = '<option value="">-- Select Village --</option>';
            
            if (district && talukData[district]) {
                talukData[district].forEach(taluk => {
                    const opt = document.createElement('option');
                    opt.value = taluk;
                    opt.textContent = taluk;
                    talukSelect.appendChild(opt);
                });
            }
            // Trigger change event
            talukSelect.dispatchEvent(new Event('change', { bubbles: true }));
        });

        talukSelect.addEventListener('change', function() {
            const taluk = this.value;
            villageSelect.innerHTML = '<option value="">-- Select Village --</option>';
            
            if (taluk && villageData[taluk]) {
                villageData[taluk].forEach(village => {
                    const opt = document.createElement('option');
                    opt.value = village;
                    opt.textContent = village;
                    villageSelect.appendChild(opt);
                });
            } else if (taluk) {
                // Fallback default village with same name for unmapped taluks
                const opt = document.createElement('option');
                opt.value = taluk + " Central";
                opt.textContent = taluk + " Central";
                villageSelect.appendChild(opt);
            }
            villageSelect.dispatchEvent(new Event('change', { bubbles: true }));
        });
    </script>
</body>
</html>
